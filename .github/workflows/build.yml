name: Wails CI Build

on:
  push:
    tags:
      - 'v*'

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: EndField_Gacha_App_Linux
            platform: linux/amd64
            os: ubuntu-latest

          - name: EndField_Gacha_App_Windows_x64.exe
            platform: windows/amd64
            os: windows-latest

          - name: EndField_Gacha_App_Windows_x86.exe
            platform: windows/386
            os: windows-latest

    runs-on: ${{ matrix.build.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config

      - name: Build with Wails
        uses: RoLingG/wails-build-action@main
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          package: false          # 不让 action 自己 upload / release
          disable-release: true
          go-version: '1.22'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.build.name }}
          path: build/bin/*