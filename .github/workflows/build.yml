name: Wails CI Build

on:
  push:
    tags:
      - 'v*'

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'EndField_Gacha_App_Linux'
            platform: 'linux/amd64'
            os: 'ubuntu-latest'

          - name: 'EndField_Gacha_App_Windows_x64'
            platform: 'windows/amd64'
            os: 'windows-latest'

          - name: 'EndField_Gacha_App_Windows_x86'
            platform: 'windows/386'
            os: 'windows-latest'

    runs-on: ${{ matrix.build.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config

      - name: Build with Wails
        uses: RoLingG/wails-build-action@main
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          package: false
          disable-release: true
          go-version: '1.22'

      - name: Prepare Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          if ("${{ matrix.build.platform }}" -eq "windows/amd64") {
            $out = "EndField_Gacha_App_Windows_x64.exe"
          } elseif ("${{ matrix.build.platform }}" -eq "windows/386") {
            $out = "EndField_Gacha_App_Windows_x86.exe"
          } else {
            Write-Error "Unknown Windows platform"
            exit 1
          }

          Get-ChildItem build/bin -Recurse -Filter *.exe |
            Select-Object -First 1 |
            ForEach-Object {
              Copy-Item $_.FullName "dist/$out"
            }

      - name: Prepare Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/bin/* dist/EndField_Gacha_App_Linux
          chmod +x dist/EndField_Gacha_App_Linux

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.name }}
          path: dist/*