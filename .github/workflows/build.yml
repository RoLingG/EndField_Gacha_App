name: Wails CI Build

on:
  push:
    tags:
      - 'v*'

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'EndField_Gacha_App_Linux'
            platform: 'linux/amd64'
            os: 'ubuntu-latest'

          - name: 'EndField_Gacha_App_Windows_x64'
            platform: 'windows/amd64'
            os: 'windows-latest'

          - name: 'EndField_Gacha_App_Windows_x86'
            platform: 'windows/386'
            os: 'windows-latest'

    runs-on: ${{ matrix.build.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config

      - name: Build with Wails
        uses: RoLingG/wails-build-action@main
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          package: false
          disable-release: true
          go-version: '1.22'

      # -------------------------
      # Windows：精确拿 exe
      # -------------------------
      - name: Prepare Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          $name = "${{ matrix.build.name }}"
          $src = "build/bin/$name.exe"

          if (!(Test-Path $src)) {
            Write-Error "Expected binary not found: $src"
            Get-ChildItem build/bin
            exit 1
          }

          Copy-Item $src "dist/$name.exe"

      # -------------------------
      # Linux：精确拿可执行文件
      # -------------------------
      - name: Prepare Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          src="build/bin/${{ matrix.build.name }}"
          if [ ! -f "$src" ]; then
            echo "Expected binary not found: $src"
            ls -lah build/bin
            exit 1
          fi
          cp "$src" "dist/${{ matrix.build.name }}"
          chmod +x "dist/${{ matrix.build.name }}"

      # -------------------------
      # 上传最终产物
      # -------------------------
      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.name }}
          path: dist/*